events {}

http {
  include       mime.types;
  default_type  application/octet-stream;
  # Matches the API's MAX_UPLOAD_MB; nginx's 1m default rejected most real .db uploads.
  client_max_body_size 50m;

  # Each question can cost up to 4 LLM calls (generate, retry, self-check,
  # summary), so cap how fast one client can ask. Per IP; 429 when exceeded.
  limit_req_zone $binary_remote_addr zone=query:10m rate=30r/m;
  limit_req_status 429;

  server {
    listen 80;

    location / {
      root /usr/share/nginx/html;
      index index.html;
    }

    location = /api/query {
      limit_req zone=query burst=10 nodelay;
      proxy_pass http://api:8000/query;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/query/stream {
      limit_req zone=query burst=10 nodelay;
      proxy_pass http://api:8000/query/stream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }

    location /api/ {
      proxy_pass http://api:8000/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
