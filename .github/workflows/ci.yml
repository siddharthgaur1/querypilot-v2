name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt ruff

      - name: ruff
        run: ruff check .

      - name: safety layers + schema chunking self-check (real committed DB, no API keys)
        run: PYTHONPATH=. python tests/test_safety_layers.py

      - name: validate docker-compose.yml
        run: docker compose config --quiet
